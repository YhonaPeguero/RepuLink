[toolchain]
# Pin a la versión del toolchain compilado desde fuente en esta máquina ARM64
# (no hay binarios Anza para aarch64; ver ~/.local/bin/solana y cargo-build-sbf).
solana_version = "2.3.13"

[features]
resolution = true
skip-lint = false

[programs.devnet]
repulink = "2mMN1jtUGZo6j9Fmq46JUTJ7639bV1aEvTXoxtu4ZtH1"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"