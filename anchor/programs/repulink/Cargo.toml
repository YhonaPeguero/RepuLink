[package]
name = "repulink"
version = "0.1.0"
description = "RepuLink — a portable on-chain reputation system for freelancers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "repulink"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[dev-dependencies]
anchor-lang = "0.32.1"
litesvm = "=0.7.1"
solana-sdk = "2.3"
spl-token = "8.0.0"
spl-associated-token-account = "7.0.0"
